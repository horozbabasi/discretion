<!doctype html>
<!--
  SYNTHETIC fixture: the counterweight to the decoy. An inert duplicate inside
  the composer region must NOT block a working page.

  Same rule as claude/composer-region-clone: resolveUnique and
  editableWithinRegion must apply the SAME admission test, or the resolver
  finds the composer and the button path then reports the send undecidable.
-->
<html lang="en">
  <body>
    <div id="app">
      <main>
        <chat-window>
          <model-response><message-content><p>lorem ipsum</p></message-content></model-response>
        </chat-window>
      </main>
      <div class="input-area">
        <rich-textarea>
          <div class="ql-editor" contenteditable="true" role="textbox" aria-multiline="true"
               aria-label="Enter a prompt here"><p>lorem ipsum</p></div>
          <div aria-hidden="true" class="measurement-clone">
            <div class="ql-editor" contenteditable="true" role="textbox" aria-multiline="true"
                 aria-label="measure"><p>lorem ipsum</p></div>
          </div>
        </rich-textarea>
        <button class="send-button" data-test-id="send-button">
          <mat-icon fonticon="send">lorem</mat-icon>
        </button>
      </div>
    </div>
  </body>
</html>
